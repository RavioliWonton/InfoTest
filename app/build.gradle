import org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

plugins {
    alias libs.plugins.android.application
    alias libs.plugins.android.cache.fix
    //alias libs.plugins.kotlin.android
    alias libs.plugins.kotlin.compose
    //alias libs.plugins.ksp
    alias libs.plugins.kotlin.serialization
    //alias libs.plugins.moshix
    //alias libs.plugins.dexcount
    //alias libs.plugins.android.retrofix
    alias libs.plugins.androidx.baselineprofile
    id 'io.github.ben-manes.versions' version '0.66.0'
    id 'app.cash.licensee' version '1.14.1'
    id 'kotlin-parcelize'
    id 'project-report'
}

android {
    compileSdk {
        version = release(37) {
            it.minorApiLevel = 2
        }
    }
    buildToolsVersion = '37.0.0'

    defaultConfig {
        applicationId = 'com.example.infotest'
        minSdk = 24
        targetSdk = 37
        versionCode = 11
        versionName = '2.0.1'

        vectorDrawables.useSupportLibrary = true
        ndk {
            abiFilters 'arm64-v8a'
        }
        androidResources.localeFilters += [ 'zh' ]
    }

    buildTypes {
        release {
            testCoverageEnabled = true
            minifyEnabled = true
            shrinkResources = true
            proguardFiles += [ getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' ]
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    compileOptions {
        incremental = true
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    buildFeatures.compose = true

    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
        resources.excludes += 'DebugProbesKt.bin'
        //resources.excludes += 'META-INF/versions/9/previous-compilation-data.bin'
    }

    composeCompiler {
        includeSourceInformation = false
        includeTraceMarkers = false
    }

    namespace = 'com.example.infotest'

    testCoverage {
        jacocoVersion = '0.8.13'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            // Robolectric needs access to JDK internals (JDK 17+); SDK 36+ also touches
            // FileDescriptor via jdk.internal.access.SharedSecrets.
            all {
                it.jvmArgs(
                    '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED',
                    '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/java.net=ALL-UNNAMED',
                    '--add-opens=java.base/java.nio=ALL-UNNAMED',
                    '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED'
                )
            }
        }
    }

    androidComponents {
        beforeVariants(selector().all()) {
            enableUnitTest = true
        }
    }

    lint {
        abortOnError = false
        checkAllWarnings = true
        checkDependencies = true
        explainIssues = true
        showAll = true
        checkReleaseBuilds = false
    }
}

licensee {
    allow('Apache-2.0')
    allow('BSD-3-Clause')
    allow('EPL-1.0')
    allowDependency('com.github.instacart', 'truetime-android', '4.0.0.alpha') {
        because 'Apache-2.0, but stupid plugin does not recognize'
    }
    ignoreDependencies('org.chromium.net') {
        transitive = true
        because 'Android Studio License and Chromium License'
    }
    ignoreDependencies('com.google.android.gms') {
        transitive = true
        because "commercial SDK"
    }
    ignoreDependencies('com.hihonor.mcs') {
        transitive = true
        because "commercial SDK"
    }
    ignoreDependencies('com.huawei.hms') {
        transitive = true
        because "commercial SDK"
    }
}

