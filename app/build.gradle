// Robolectric ships a host-native Conscrypt; the Android AAR only contains Android ABIs and makes
// Robolectric's TLS setup fail with UnsatisfiedLinkError: no conscrypt_jni in java.library.path.
configurations.configureEach {
    if (name.endsWith('UnitTestRuntimeClasspath')) {
        exclude group: 'org.conscrypt', module: 'conscrypt-android'
    }
}

kotlin {
    compilerOptions {
        //jvmTarget = JvmTarget.JVM_25
        languageVersion = KotlinVersion.KOTLIN_2_6
        apiVersion = KotlinVersion.KOTLIN_2_6
        javaParameters = true
        progressiveMode = true
        jvmDefault = JvmDefaultMode.NO_COMPATIBILITY
        extraWarnings = true
        freeCompilerArgs.addAll(["-Xjspecify-annotations=strict", "-Xbackend-threads=0", "-XIntrinsic-const-evaluation"])
    }
}

tasks.named("dependencyUpdates") {
    configure {
        checkConstraints = true
        checkBuildEnvironmentConstraints = true
    }
}